<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timer — Simple Countdown</title>
<meta name="description" content="A clean, distraction-free countdown timer with quick presets, any custom time, and a very loud alarm." />
<style>
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.129 0.042 264.695);
    --card: oklch(1 0 0);
    --primary: oklch(0.65 0.19 35);
    --primary-foreground: oklch(0.984 0.003 247.858);
    --secondary: oklch(0.968 0.007 247.896);
    --secondary-foreground: oklch(0.208 0.042 265.755);
    --muted: oklch(0.968 0.007 247.896);
    --muted-foreground: oklch(0.554 0.046 257.417);
    --accent: oklch(0.968 0.007 247.896);
    --accent-foreground: oklch(0.208 0.042 265.755);
    --border: oklch(0.929 0.013 255.508);
    --input: oklch(0.929 0.013 255.508);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 1rem;
  }
  .dial { position: relative; width: 20rem; height: 20rem; }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .dial .track { fill: none; stroke: var(--muted); stroke-width: 10; }
  .dial .ring {
    fill: none; stroke: var(--primary); stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
  .time {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 600; font-variant-numeric: tabular-nums;
    font-size: 3.75rem; letter-spacing: -0.02em;
  }
  .time.small { font-size: 2rem; }
  .presets { display: flex; gap: 0.5rem; }
  .pill {
    border: none; cursor: pointer;
    border-radius: 9999px; padding: 0.5rem 1rem;
    font-size: 0.875rem; font-weight: 500;
    background: var(--secondary); color: var(--secondary-foreground);
    transition: background-color 0.15s ease;
    font-family: inherit;
  }
  .pill:hover { background: var(--accent); }
  .pill.active { background: var(--primary); color: var(--primary-foreground); }
  .custom {
    display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    border: 1px solid var(--border); background: var(--card);
    border-radius: 1rem; padding: 0.75rem 1rem;
  }
  .custom .row { display: flex; align-items: center; gap: 0.75rem; }
  .custom label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--muted-foreground); }
  .custom input {
    width: 4.5rem; border: 1px solid var(--input); background: var(--background);
    border-radius: 0.5rem; padding: 0.375rem 0.5rem;
    text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1rem; font-variant-numeric: tabular-nums; color: var(--foreground);
    outline: none;
  }
  .custom input:focus { box-shadow: 0 0 0 2px var(--accent); }
  .set {
    border: none; cursor: pointer;
    border-radius: 0.5rem; padding: 0.375rem 1rem;
    font-size: 0.875rem; font-weight: 500; font-family: inherit;
    background: var(--secondary); color: var(--secondary-foreground);
  }
  .set:hover { background: var(--accent); }
  .hint { font-size: 0.75rem; color: var(--muted-foreground); }
  .controls { display: flex; gap: 0.75rem; }
  .main-btn {
    border: none; cursor: pointer;
    border-radius: 9999px; padding: 0.75rem 2rem;
    font-size: 1rem; font-weight: 600; font-family: inherit;
    background: var(--primary); color: var(--primary-foreground);
  }
  .main-btn:hover { opacity: 0.9; }
  .reset-btn {
    border: 1px solid var(--border); cursor: pointer;
    border-radius: 9999px; padding: 0.75rem 2rem;
    font-size: 1rem; font-weight: 600; font-family: inherit;
    background: transparent; color: var(--foreground);
  }
  .reset-btn:hover { background: var(--accent); }
</style>
</head>
<body>
  <div class="dial">
    <svg viewBox="0 0 320 320" aria-hidden="true">
      <circle class="track" cx="160" cy="160" r="140"></circle>
      <circle class="ring" id="ring" cx="160" cy="160" r="140"></circle>
    </svg>
    <div class="time" id="time">05:00</div>
  </div>

  <div class="presets" id="presets"></div>

  <form class="custom" id="customForm">
    <div class="row">
      <label>min <input id="mins" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Custom minutes" /></label>
      <label>sec <input id="secs" inputmode="numeric" autocomplete="off" placeholder="00" aria-label="Custom seconds" /></label>
      <button type="submit" class="set">Set</button>
    </div>
    <p class="hint">The alarm is very loud — press Reset or Start to silence it.</p>
  </form>

  <div class="controls">
    <button class="main-btn" id="startBtn">Start</button>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>

<script>
(function () {
  "use strict";

  var PRESETS = [1, 5, 10, 25];
  var R = 140;
  var C = 2 * Math.PI * R;

  var total = 300;
  var left = 300;
  var running = false;
  var timerId = null;

  var ctx = null;
  var stopAlarmFn = null;

  var ringEl = document.getElementById("ring");
  var timeEl = document.getElementById("time");
  var presetsEl = document.getElementById("presets");
  var customForm = document.getElementById("customForm");
  var minsEl = document.getElementById("mins");
  var secsEl = document.getElementById("secs");
  var startBtn = document.getElementById("startBtn");
  var resetBtn = document.getElementById("resetBtn");

  ringEl.setAttribute("stroke-dasharray", C);
  ringEl.setAttribute("stroke-dashoffset", 0);

  function fmt(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }

  function render() {
    var label = fmt(left);
    timeEl.textContent = label;
    timeEl.style.fontSize = label.length >= 8 ? "2rem" : label.length >= 7 ? "2.25rem" : label.length >= 6 ? "3rem" : "3.75rem";
    var pct = total ? left / total : 0;
    ringEl.setAttribute("stroke-dashoffset", C * (1 - pct));
  }

  function ensureCtx() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function stopAlarm() {
    if (stopAlarmFn) stopAlarmFn();
    stopAlarmFn = null;
  }

  // Hard-limited two-tone siren: stacked square/saw layers through a
  // compressor so the alarm sits at full scale instead of a soft beep.
  function playAlarm() {
    var c = ensureCtx();
    var now = c.currentTime;

    var master = c.createGain();
    master.gain.setValueAtTime(1, now);

    var comp = c.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-20, now);
    comp.knee.setValueAtTime(0, now);
    comp.ratio.setValueAtTime(30, now);
    comp.attack.setValueAtTime(0.001, now);
    comp.release.setValueAtTime(0.02, now);

    master.connect(comp);
    comp.connect(c.destination);

    var STEP = 0.26;
    var BURSTS = 26; // ~7s of siren
    var oscs = [];

    for (var i = 0; i < BURSTS; i++) {
      var t = now + i * STEP;
      var hi = i % 2 === 0 ? 880 : 1318.5;
      var layers = [
        ["square", hi, 0.55],
        ["square", hi * 2, 0.35],
        ["sawtooth", hi * 0.25, 0.5]
      ];
      for (var j = 0; j < layers.length; j++) {
        var o = c.createOscillator();
        o.type = layers[j][0];
        o.frequency.setValueAtTime(layers[j][1], t);
        var g = c.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(layers[j][2], t + 0.008);
        g.gain.setValueAtTime(layers[j][2], t + STEP * 0.78);
        g.gain.linearRampToValueAtTime(0, t + STEP * 0.96);
        o.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + STEP);
        oscs.push(o);
      }
    }

    var cleanup = window.setTimeout(function () {
      stopAlarmFn = null;
      master.disconnect();
    }, (BURSTS * STEP + 0.2) * 1000);

    stopAlarmFn = function () {
      window.clearTimeout(cleanup);
      master.gain.cancelScheduledValues(c.currentTime);
      master.gain.setValueAtTime(0, c.currentTime);
      for (var k = 0; k < oscs.length; k++) {
        try { oscs[k].stop(); } catch (e) { /* already stopped */ }
      }
      master.disconnect();
    };
  }

  function tick() {
    left = left <= 1 ? 0 : left - 1;
    render();
    if (left === 0 && total > 0) {
      setRunning(false);
      playAlarm();
    }
  }

  function setRunning(v) {
    running = v;
    if (running) {
      timerId = window.setInterval(tick, 1000);
    } else if (timerId) {
      window.clearInterval(timerId);
      timerId = null;
    }
    startBtn.textContent = running ? "Pause" : "Start";
  }

  function setPreset(min) {
    stopAlarm();
    setRunning(false);
    total = min * 60;
    left = total;
    render();
    markActive();
  }

  function markActive() {
    var buttons = presetsEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("active", Number(buttons[i].dataset.min) * 60 === total);
    }
  }

  PRESETS.forEach(function (m) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pill";
    b.textContent = m + " min";
    b.dataset.min = m;
    b.addEventListener("click", function () { setPreset(m); });
    presetsEl.appendChild(b);
  });

  function digits(v) { return v.replace(/\D/g, ""); }

  minsEl.addEventListener("input", function () { minsEl.value = digits(minsEl.value); });
  secsEl.addEventListener("input", function () { secsEl.value = digits(secsEl.value); });

  customForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var m = parseInt(minsEl.value || "0", 10) || 0;
    var s = parseInt(secsEl.value || "0", 10) || 0;
    var t = m * 60 + s; // seconds roll over into minutes: 90 sec -> 1:30
    if (t <= 0) return;
    stopAlarm();
    setRunning(false);
    total = t;
    left = t;
    render();
    markActive();
  });

  startBtn.addEventListener("click", function () {
    stopAlarm();
    if (left > 0) {
      ensureCtx();
      setRunning(!running);
    }
  });

  resetBtn.addEventListener("click", function () {
    stopAlarm();
    setRunning(false);
    left = total;
    render();
  });

  markActive();
  render();
})();
</script>
</body>
</html>
